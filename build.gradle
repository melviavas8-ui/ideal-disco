plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Meteor Maven'
        url = 'https://maven.meteordev.org/releases'
    }
}

// Baritone API is required for source compilation.
// Place the official Baritone 1.13.1 Fabric API JAR for Minecraft 1.21.4 at:
// libs/baritone-api-fabric-1.13.1.jar
def baritoneApiJar = file('libs/baritone-api-fabric-1.13.1.jar')
def verifyBaritoneApi = tasks.register('verifyBaritoneApi') {
    inputs.file(baritoneApiJar)
    doLast {
        def requiredEntries = [
            'baritone/api/BaritoneAPI.class',
            'baritone/api/IBaritone.class',
            'baritone/api/pathing/goals/GoalBlock.class',
            'baritone/api/pathing/goals/GoalXZ.class',
            'baritone/api/utils/IPlayerContext.class'
        ]

        if (!baritoneApiJar.isFile()) {
            throw new GradleException(
                'Missing Baritone API JAR: ' + baritoneApiJar +
                '\nDownload baritone-api-fabric-1.13.1.jar for Minecraft 1.21.4 and put it into the project libs/ folder.'
            )
        }

        def zip = new java.util.zip.ZipFile(baritoneApiJar)
        try {
            def missingEntries = requiredEntries.findAll { zip.getEntry(it) == null }
            if (!missingEntries.isEmpty()) {
                throw new GradleException(
                    'The file libs/baritone-api-fabric-1.13.1.jar is not the expected public API JAR. Missing classes: ' +
                    missingEntries.join(', ')
                )
            }
        } finally {
            zip.close()
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Identity "named" layer: keeps the intermediary names used by the recovered source.
    mappings files('mappings/intermediary-named-1.21.4.jar')

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "io.github.llamalad7:mixinextras-fabric:${project.mixinextras_version}"

    implementation 'meteordevelopment:orbit:0.2.3'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    implementation 'ai.catboost:catboost-common:1.2.7'
    implementation 'ai.catboost:catboost-prediction:1.2.7'
    implementation 'dev.redstones.mediaplayerinfo:media-player-info:0.1.0'
    implementation 'com.googlecode.soundlibs:jlayer:1.0.1.4'
    implementation 'io.netty:netty-handler-proxy:4.1.118.Final'

    include('meteordevelopment:orbit:0.2.3') { transitive = false }
    include('ai.catboost:catboost-common:1.2.7') { transitive = false }
    include('ai.catboost:catboost-prediction:1.2.7') { transitive = false }
    include('dev.redstones.mediaplayerinfo:media-player-info:0.1.0') { transitive = false }
    include('com.googlecode.soundlibs:jlayer:1.0.1.4') { transitive = false }
    include('io.netty:netty-handler-proxy:4.1.118.Final') { transitive = false }
    include('io.netty:netty-codec-socks:4.1.118.Final') { transitive = false }

    modImplementation files(baritoneApiJar)
    modRuntimeOnly files('libs/nether-pathfinder-1.4.1.jar')

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    compileOnly 'org.jetbrains:annotations:26.0.2'
}

tasks.named('compileJava').configure {
    dependsOn(verifyBaritoneApi)
}

// Compile all Java sources from src/main/java using Gradle defaults.

loom {
    accessWidenerPath = file('src/main/resources/daamky.accesswidener')
    mixin {
        // The original, already-remapped refmap is bundled in resources.
        useLegacyMixinAp = false
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
